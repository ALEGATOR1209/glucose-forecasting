name: Test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --group dev
      - run: uv run glucose --help
      - run: uv run pytest -q
      - run: uv build
      - run: uv tool run --from dist/*.whl glucose --help
