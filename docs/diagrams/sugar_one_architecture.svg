<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1380" viewBox="0 0 1000 1380">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#999"/>
    </marker>
    <style>
      text { font-family: "Latin Modern Roman", "Times New Roman", Times, serif; fill: #111; }
      .lbl  { font-size: 15px; text-anchor: middle; }
      .sub  { font-size: 12.5px; text-anchor: middle; fill: #444; }
      .dim  { font-size: 12.5px; font-style: italic; fill: #555; }
      .dimc { font-size: 12.5px; font-style: italic; fill: #555; text-anchor: middle; }
      .grplbl { font-size: 15px; font-style: italic; fill: #333; }
      .big  { font-size: 18px; text-anchor: middle; }
      .box  { stroke: #333; stroke-width: 1.2; }
      .grp  { fill: none; stroke: #444; stroke-width: 1.2; stroke-dasharray: 7 4; }
      .sg   { stroke: #aaa; stroke-width: 1; }
      .ln   { stroke: #333; stroke-width: 1.4; fill: none; }
    </style>
  </defs>

  <rect width="1000" height="1380" fill="#ffffff"/>

  <!-- legend -->
  <g>
    <rect x="30" y="30" width="16" height="12" class="box" fill="#f2b8b0"/>
    <text x="54" y="40" class="dim">attention</text>
    <rect x="30" y="52" width="16" height="12" class="box" fill="#f7e3a8"/>
    <text x="54" y="62" class="dim">linear / FFN</text>
    <rect x="30" y="74" width="16" height="12" class="box" fill="#cfe6bf"/>
    <text x="54" y="84" class="dim">embedding / mixing</text>
  </g>

  <!-- ===== OUTPUT ===== -->
  <text x="500" y="42" class="big">Output targets</text>
  <text x="500" y="64" class="dimc">ŷ : (B, 12)  —  12 steps × 5 min = 60 min horizon</text>
  <line x1="500" y1="105" x2="500" y2="74" class="ln" marker-end="url(#arr)"/>

  <rect x="370" y="105" width="260" height="46" rx="3" class="box" fill="#b8dcef"/>
  <text x="500" y="134" class="lbl">out_fc : Linear(32 → 12)</text>

  <line x1="500" y1="212" x2="500" y2="155" class="ln" marker-end="url(#arr)"/>
  <text x="512" y="188" class="dim">(B, 32)</text>

  <!-- ===== HEAD GROUP ===== -->
  <rect x="310" y="212" width="380" height="196" class="grp"/>
  <text x="298" y="298" class="grplbl" text-anchor="end">Dimensionality</text>
  <text x="298" y="318" class="grplbl" text-anchor="end">reduction layers</text>

  <rect x="340" y="232" width="320" height="56" rx="3" class="box" fill="#f7e3a8"/>
  <text x="500" y="256" class="lbl">Dense : flatten_fc  Linear(4096 → 32)</text>
  <text x="500" y="276" class="sub">GELU + Dropout(0.1)   ·   ≈131k params</text>

  <line x1="500" y1="348" x2="500" y2="292" class="ln" marker-end="url(#arr)"/>
  <text x="512" y="324" class="dim">(B, 4096)</text>

  <rect x="340" y="348" width="320" height="46" rx="3" class="box" fill="#faeecd"/>
  <text x="500" y="377" class="lbl">Flatten : (B, 32, 128) → (B, 4096)</text>

  <line x1="500" y1="452" x2="500" y2="412" class="ln" marker-end="url(#arr)"/>
  <text x="512" y="437" class="dim">(128, B, 32)</text>

  <!-- ===== PARALLEL BLOCK GROUP ===== -->
  <rect x="60" y="452" width="880" height="586" class="grp"/>
  <text x="75" y="474" class="grplbl">SugarOne parallel block  × 5</text>
  <text x="75" y="492" class="dim">only the glucose stream is updated — the aux streams are re-read unchanged by every block</text>

  <!-- repeat loop -->
  <path d="M 940 520 L 980 520 L 980 1010 L 940 1010" class="ln" marker-end="url(#arr)"/>
  <text x="963" y="765" class="dimc">× 5</text>

  <!-- fuse -->
  <rect x="280" y="510" width="440" height="50" rx="3" class="box" fill="#dfe7f2"/>
  <text x="500" y="533" class="lbl">ln_fuse ( cross_out + ms_out )</text>
  <text x="500" y="551" class="sub">(128, B, 32)</text>

  <line x1="275" y1="770" x2="392" y2="565" class="ln" marker-end="url(#arr)"/>
  <line x1="725" y1="692" x2="608" y2="565" class="ln" marker-end="url(#arr)"/>

  <!-- multi-scale subgroup -->
  <rect x="80" y="600" width="390" height="400" rx="4" class="sg" fill="#fdf6f5"/>
  <text x="275" y="624" class="lbl">Multi-scale self-attention</text>
  <text x="275" y="642" class="sub">(glucose only — no auxiliaries)</text>

  <rect x="100" y="770" width="350" height="56" rx="3" class="box" fill="#f7e3a8"/>
  <text x="275" y="792" class="lbl">high + up2 + up4,  FFN 32 → 128 → 32</text>
  <text x="275" y="811" class="sub">ln2 residual  →  (128, B, 32)</text>

  <line x1="150" y1="880" x2="200" y2="830" class="ln" marker-end="url(#arr)"/>
  <line x1="275" y1="880" x2="275" y2="830" class="ln" marker-end="url(#arr)"/>
  <line x1="395" y1="880" x2="350" y2="830" class="ln" marker-end="url(#arr)"/>

  <rect x="95" y="880" width="110" height="95" rx="3" class="box" fill="#f2b8b0"/>
  <text x="150" y="906" class="lbl">DS = 1</text>
  <text x="150" y="927" class="sub">self-attn</text>
  <text x="150" y="947" class="sub">(128, B, 32)</text>
  <text x="150" y="966" class="sub">8 heads</text>

  <rect x="215" y="880" width="120" height="95" rx="3" class="box" fill="#f6cdc7"/>
  <text x="275" y="906" class="lbl">DS = 2</text>
  <text x="275" y="927" class="sub">AvgPool(2)</text>
  <text x="275" y="947" class="sub">(64, B, 32)</text>
  <text x="275" y="966" class="sub">interp ↑ 128</text>

  <rect x="345" y="880" width="105" height="95" rx="3" class="box" fill="#f6cdc7"/>
  <text x="397" y="906" class="lbl">DS = 4</text>
  <text x="397" y="927" class="sub">AvgPool(4)</text>
  <text x="397" y="947" class="sub">(32, B, 32)</text>
  <text x="397" y="966" class="sub">interp ↑ 128</text>

  <!-- cross-attention subgroup -->
  <rect x="530" y="600" width="400" height="400" rx="4" class="sg" fill="#f7fbf5"/>
  <text x="730" y="624" class="lbl">Cross-attention  (3 auxiliaries)</text>
  <text x="730" y="642" class="sub">Q = glucose,  K / V = basal, bolus, carbs</text>

  <rect x="545" y="692" width="370" height="50" rx="3" class="box" fill="#f7e3a8"/>
  <text x="730" y="713" class="lbl">FFN 32 → 128 → 32,  ln2 residual</text>
  <text x="730" y="732" class="sub">(128, B, 32)</text>

  <line x1="730" y1="770" x2="730" y2="746" class="ln" marker-end="url(#arr)"/>

  <rect x="545" y="770" width="370" height="52" rx="3" class="box" fill="#cfe6bf"/>
  <text x="730" y="792" class="lbl">merged = Σᵢ softmax(mix_logits)[i] · resᵢ</text>
  <text x="730" y="811" class="sub">mix_logits : (3,)  —  learnable 3-way mix</text>

  <line x1="730" y1="852" x2="730" y2="826" class="ln" marker-end="url(#arr)"/>

  <rect x="545" y="848" width="370" height="34" rx="3" class="box" fill="#e9f2e3"/>
  <text x="730" y="870" class="sub">ln1 : glucose + dropout(out)  —  one shared LayerNorm</text>

  <line x1="605" y1="915" x2="605" y2="886" class="ln" marker-end="url(#arr)"/>
  <line x1="730" y1="915" x2="730" y2="886" class="ln" marker-end="url(#arr)"/>
  <line x1="855" y1="915" x2="855" y2="886" class="ln" marker-end="url(#arr)"/>

  <rect x="547" y="915" width="116" height="60" rx="3" class="box" fill="#f2b8b0"/>
  <text x="605" y="939" class="lbl">MHA basal</text>
  <text x="605" y="960" class="sub">32 dim, 8 heads</text>

  <rect x="672" y="915" width="116" height="60" rx="3" class="box" fill="#f2b8b0"/>
  <text x="730" y="939" class="lbl">MHA bolus</text>
  <text x="730" y="960" class="sub">32 dim, 8 heads</text>

  <rect x="797" y="915" width="116" height="60" rx="3" class="box" fill="#f2b8b0"/>
  <text x="855" y="939" class="lbl">MHA carbs</text>
  <text x="855" y="960" class="sub">32 dim, 8 heads</text>

  <!-- ===== STREAM ROUTING INTO BLOCK ===== -->
  <line x1="220" y1="1078" x2="275" y2="1002" class="ln" marker-end="url(#arr)"/>
  <line x1="220" y1="1078" x2="560" y2="1002" class="ln" marker-end="url(#arr)"/>
  <text x="392" y="1052" class="dim">Q = glucose</text>

  <line x1="480" y1="1078" x2="605" y2="978" class="ln" marker-end="url(#arr)"/>
  <line x1="660" y1="1078" x2="730" y2="978" class="ln" marker-end="url(#arr)"/>
  <line x1="840" y1="1078" x2="855" y2="978" class="ln" marker-end="url(#arr)"/>

  <!-- positional encoding -->
  <rect x="135" y="1078" width="790" height="48" rx="3" class="box" fill="#cfe6bf"/>
  <text x="530" y="1099" class="lbl">+ PositionalEncoding  (sinusoidal, fixed buffer (1, 5000, 32))</text>
  <text x="530" y="1118" class="sub">(B, 128, 32) each  →  permute →  (128, B, 32)</text>

  <line x1="220" y1="1160" x2="220" y2="1130" class="ln" marker-end="url(#arr)"/>
  <line x1="480" y1="1160" x2="480" y2="1130" class="ln" marker-end="url(#arr)"/>
  <line x1="660" y1="1160" x2="660" y2="1130" class="ln" marker-end="url(#arr)"/>
  <line x1="840" y1="1160" x2="840" y2="1130" class="ln" marker-end="url(#arr)"/>

  <!-- embeddings -->
  <rect x="135" y="1160" width="170" height="52" rx="3" class="box" fill="#f7e3a8"/>
  <text x="220" y="1182" class="lbl">embed_glucose</text>
  <text x="220" y="1201" class="sub">Linear(1 → 32)</text>

  <rect x="395" y="1160" width="170" height="52" rx="3" class="box" fill="#f7e3a8"/>
  <text x="480" y="1182" class="lbl">embed_basal</text>
  <text x="480" y="1201" class="sub">Linear(1 → 32)</text>

  <rect x="575" y="1160" width="170" height="52" rx="3" class="box" fill="#f7e3a8"/>
  <text x="660" y="1182" class="lbl">embed_bolus</text>
  <text x="660" y="1201" class="sub">Linear(1 → 32)</text>

  <rect x="755" y="1160" width="170" height="52" rx="3" class="box" fill="#f7e3a8"/>
  <text x="840" y="1182" class="lbl">embed_carbs</text>
  <text x="840" y="1201" class="sub">Linear(1 → 32)</text>

  <line x1="220" y1="1248" x2="220" y2="1216" class="ln" marker-end="url(#arr)"/>
  <line x1="480" y1="1248" x2="480" y2="1216" class="ln" marker-end="url(#arr)"/>
  <line x1="660" y1="1248" x2="660" y2="1216" class="ln" marker-end="url(#arr)"/>
  <line x1="840" y1="1248" x2="840" y2="1216" class="ln" marker-end="url(#arr)"/>

  <!-- input channels -->
  <rect x="135" y="1248" width="170" height="58" class="box" fill="#f6b0a8"/>
  <text x="220" y="1274" class="lbl">glucose</text>
  <text x="220" y="1293" class="sub">(B, 128, 1)</text>

  <rect x="395" y="1248" width="170" height="58" class="box" fill="#f7d9a0"/>
  <text x="480" y="1274" class="lbl">basal rate</text>
  <text x="480" y="1293" class="sub">(B, 128, 1)</text>

  <rect x="575" y="1248" width="170" height="58" class="box" fill="#bfe0b0"/>
  <text x="660" y="1274" class="lbl">bolus</text>
  <text x="660" y="1293" class="sub">(B, 128, 1)</text>

  <rect x="755" y="1248" width="170" height="58" class="box" fill="#a8d4ec"/>
  <text x="840" y="1274" class="lbl">carbs</text>
  <text x="840" y="1293" class="sub">(B, 128, 1)</text>

  <!-- input width dimension -->
  <line x1="135" y1="1325" x2="305" y2="1325" class="ln" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="220" y="1345" class="dimc">128 steps</text>

  <text x="620" y="1332" class="lbl">Input window   x : (B, 128, 4)   —   128 × 5 min ≈ 10.7 h,  MinMax-scaled</text>
</svg>
